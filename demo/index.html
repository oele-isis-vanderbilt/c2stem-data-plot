<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data plot demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 16px;
        background: #f7f7f5;
        color: #1f1f1d;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      button,
      select {
        font: inherit;
        font-size: 14px;
        padding: 6px 12px;
        border: 1px solid #d9d8d2;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      label {
        font-size: 14px;
      }
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 2000;
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 20px;
      }
      #log {
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        background: #fff;
        border: 1px solid #d9d8d2;
        border-radius: 6px;
        padding: 8px;
        max-width: 640px;
        height: 340px;
        overflow: auto;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="toggle">Data table</button>
      <label>Task
        <select id="task">
          <option value="lesson1">Lesson 1</option>
          <option value="lesson2">Lesson 2</option>
        </select>
      </label>
      <label><input type="checkbox" id="readonly" /> Read only</label>
      <button id="append">Add simulation rows</button>
      <button id="freeze">Freeze for 3 s</button>
      <label><input type="checkbox" id="fail" /> Make saves fail</label>
    </div>
    <p>Adapter calls (an in-memory server that answers after 300 ms):</p>
    <div id="log"></div>
    <div id="overlay">Frozen</div>

    <data-plot-tool id="tool"></data-plot-tool>

    <script type="module">
      import "../src/index.js";

      const TASKS = {
        lesson1: {
          title: "Mass vs stopping position",
          columns: [
            { key: "mass", label: "Mass", unit: "kg" },
            { key: "stopPos", label: "Stopping position", unit: "m" },
          ],
          plot: { x: "mass", y: ["stopPos"] },
        },
        lesson2: {
          title: "Mass vs velocity and energy",
          columns: [
            { key: "mass", label: "Mass", unit: "kg" },
            { key: "velocity", label: "Velocity", unit: "m/s" },
            { key: "pe", label: "Potential energy", unit: "J" },
            { key: "ke", label: "Kinetic energy", unit: "J" },
          ],
          plot: { x: "mass", y: ["velocity", "pe", "ke"] },
        },
      };

      const logEl = document.getElementById("log");
      const log = (line) => {
        logEl.textContent += line + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      };
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const store = {};
      const adapter = {
        async load(taskId) {
          await wait(300);
          log(`load ${taskId} → ${store[taskId] ? store[taskId].rows.length + " rows" : "nothing saved"}`);
          return store[taskId] || null;
        },
        async save(taskId, doc, opts) {
          await wait(300);
          if (document.getElementById("fail").checked) {
            log(`save ${taskId} FAILED`);
            throw new Error("demo failure");
          }
          store[taskId] = JSON.parse(JSON.stringify(doc));
          log(`save ${taskId}: ${doc.rows.length} rows${opts && opts.keepalive ? " (keepalive)" : ""}`);
        },
        async log(taskId, events) {
          await wait(300);
          events.forEach((e) => log(`event ${taskId} ${e.type} ${JSON.stringify(e.data)}`));
        },
      };

      const tool = document.getElementById("tool");
      const task = document.getElementById("task");
      tool.adapter = adapter;
      tool.config = TASKS[task.value];
      tool.taskId = task.value;

      task.addEventListener("change", () => {
        tool.config = TASKS[task.value];
        tool.taskId = task.value;
      });
      document.getElementById("toggle").addEventListener("click", () =>
        tool.view === "closed" ? tool.open() : tool.view === "collapsed" ? tool.expand() : tool.collapse()
      );
      document.getElementById("readonly").addEventListener("change", (e) => (tool.readonly = e.target.checked));
      document.getElementById("append").addEventListener("click", () => {
        const rows =
          task.value === "lesson1"
            ? [1, 2, 3].map((m) => ({ mass: m, stopPos: (12 / m).toFixed(2) }))
            : [1, 2, 3].map((m) => ({ mass: m, velocity: (6 / Math.sqrt(m)).toFixed(2), pe: 18, ke: 18 }));
        tool.appendRows(rows, { source: "simulation" });
      });
      document.getElementById("freeze").addEventListener("click", () => {
        const overlay = document.getElementById("overlay");
        overlay.style.display = "flex";
        setTimeout(() => (overlay.style.display = "none"), 3000);
      });
      tool.addEventListener("viewchange", (e) => log(`viewchange ${e.detail.view}`));
    </script>
  </body>
</html>
